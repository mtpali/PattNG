name: Build optimized arm64 APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/v2ray-awg-controls]
    paths-ignore:
      - '**/*.md'
      - 'fastlane/**'

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ABI_FILTERS: arm64-v8a
      PATTNG_NATIVE_CACHE: ${{ github.workspace }}/.native-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: AndroidLibXrayLite/go.mod
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370'
      - uses: actions/cache@v6
        with:
          path: .native-cache
          key: native-p69-arm64-b70a5a90-0c6e93c5
      - name: Verify and stage the exact P69 native dependencies
        run: python3 scripts/prepare_native.py
      - uses: actions/cache@v6
        id: awg-cache
        with:
          path: .native-cache/awg/libv2ray.aar
          key: awg-p69-arm64-${{ hashFiles('core/patches/*.patch', 'scripts/build-amnezia-libv2ray.sh', 'AndroidLibXrayLite/go.*') }}
      - name: Build and test AmneziaWG on the P69 core
        if: steps.awg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler qemu-user
          mobile_version=$(awk '$1 == "golang.org/x/mobile" { print $2; exit }' AndroidLibXrayLite/go.mod)
          go install "golang.org/x/mobile/cmd/gomobile@$mobile_version"
          go install "golang.org/x/mobile/cmd/gobind@$mobile_version"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          gomobile init
          AWG_TEST_ARM64=1 bash scripts/build-amnezia-libv2ray.sh "$PATTNG_NATIVE_CACHE/awg/libv2ray.aar"
      - name: Stage the ARM64 AmneziaWG core
        run: cp .native-cache/awg/libv2ray.aar V2rayNG/app/libs/libv2ray.aar
      - name: Build HEV from the pinned source
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash compile-hevtun.sh
          cp -r libs/. V2rayNG/app/libs/
      - name: Test and assemble the optimized arm64 release
        working-directory: V2rayNG
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest --tests 'com.v2ray.ang.core.PolicyGroupGeoIpTest' --tests 'com.v2ray.ang.core.ServiceToggleTest' --tests 'com.v2ray.ang.service.ServiceLifecycleGateTest' --tests 'com.v2ray.ang.fmt.WireguardFmtTest' --tests 'com.v2ray.ang.handler.SubscriptionProfilesTest' --tests 'com.v2ray.ang.handler.SubscriptionMutationTest' -PABI_FILTERS=arm64-v8a --no-daemon
          ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug :app:assemblePlaystoreRelease :app:lintPlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon
      - name: Verify APK architecture and R8 outputs
        run: |
          python3 - <<'PYAPK'
          from pathlib import Path
          from zipfile import ZipFile
          base = Path('V2rayNG/app/build/outputs')
          apks = list((base / 'apk/playstore/release').glob('*.apk'))
          assert len(apks) == 1, apks
          with ZipFile(apks[0]) as apk:
              abis = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/')}
              assert abis == {'arm64-v8a'}, abis
              for library in ('libgojni.so', 'libaether.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so', 'libpsiphon-tunnel-core.so', 'liblyrebird.so'):
                  assert f'lib/arm64-v8a/{library}' in apk.namelist(), library
          assert (base / 'mapping/playstoreRelease/mapping.txt').is_file()
          assert (base / 'mapping/playstoreRelease/usage.txt').is_file()
          PYAPK
      - uses: actions/upload-artifact@v7
        with:
          name: PattNG-arm64-release-unsigned
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/playstore/release/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-verification
          path: |
            V2rayNG/app/build/reports/tests/
            V2rayNG/app/build/test-results/
            V2rayNG/app/build/reports/lint-results-*
            V2rayNG/app/build/outputs/mapping/playstoreRelease/
